<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#112d4e"><title>Unit Peperiksaan | Peperiksaan Akhir</title>
<style>
:root{--navy:#102b49;--blue:#1d5c85;--gold:#e4b85f;--cream:#f6f3ec;--ink:#17283b;--muted:#718096}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 78% 12%,#e3edf0 0,transparent 30%),var(--cream);display:flex;flex-direction:column}.topbar{height:9px;background:linear-gradient(90deg,var(--gold) 0 20%,var(--navy) 20% 100%)}header{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:28px 0;display:flex;align-items:center;gap:15px}header .logo{width:min(205px,42vw);height:auto;max-height:74px;object-fit:contain;display:block;flex:0 1 auto}.brand{font-size:14px;letter-spacing:.16em;font-weight:800;color:var(--navy);text-transform:uppercase}.brand small{display:block;font-weight:500;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:4px}main{flex:1;display:grid;place-items:center;padding:32px 24px 76px}.card{position:relative;overflow:hidden;width:min(800px,100%);background:#fff;border-radius:22px;padding:clamp(30px,7vw,72px);box-shadow:0 24px 70px #102b4918;border:1px solid #e8e8e2;text-align:center}.card:before{content:"";position:absolute;width:280px;height:280px;border:1px solid #e7dcc1;border-radius:50%;right:-180px;top:-185px}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#9b742b;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.eyebrow:before,.eyebrow:after{content:"";width:22px;height:1px;background:var(--gold)}h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;color:var(--navy);font-size:clamp(38px,7vw,64px);line-height:1.05;margin:22px 0 12px}.course{color:var(--blue);font-size:clamp(17px,3vw,21px);font-weight:650;letter-spacing:.02em;margin:0}.rule{height:1px;width:58px;margin:30px auto;background:var(--gold)}.details{display:flex;justify-content:center;gap:clamp(25px,7vw,70px);margin:0 auto 35px;flex-wrap:wrap}.detail{display:flex;align-items:center;gap:12px;text-align:left}.icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#f1f5f5;color:var(--blue);font-size:20px}.detail span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detail strong{font-size:15px;color:var(--navy)}.timer-label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.timer{font-variant-numeric:tabular-nums;color:var(--navy);font-size:clamp(40px,9vw,66px);font-weight:650;letter-spacing:.055em;margin:10px 0 22px}.button{appearance:none;border:0;border-radius:999px;padding:15px 29px;background:var(--navy);color:white;font-size:14px;font-weight:750;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 20px #102b4930;transition:transform .18s,background .18s}.button:hover{background:var(--blue);transform:translateY(-2px)}.button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.note{font-size:12px;color:var(--muted);margin:16px 0 0}footer{text-align:center;padding:18px 20px 25px;color:#8190a0;font-size:12px}footer b{color:var(--navy);letter-spacing:.06em}@media(max-width:560px){header{width:calc(100% - 36px);padding:20px 0}.card{border-radius:18px}.details{flex-direction:column;width:max-content;gap:17px}.button{width:100%;max-width:310px}}
</style>
</head>
<body><div class="topbar"></div>
<header><img class="logo" src="logo-kolej-komuniti-papar.png" alt="Logo Kolej Komuniti Papar"><div class="brand">Unit Peperiksaan<small>Makluman Peperiksaan Kolej</small></div></header>
<main><section class="card" aria-labelledby="title"><div class="eyebrow">Makluman rasmi</div><h1 id="title">Peperiksaan Akhir</h1><p class="course">SFC11593 · Basic Mathematics</p><div class="rule"></div>
<div class="details"><div class="detail"><div class="icon" aria-hidden="true">◷</div><div><span>Waktu peperiksaan</span><strong>9.00 – 11.00 pagi</strong></div></div><div class="detail"><div class="icon" aria-hidden="true">⌖</div><div><span>Tempat</span><strong>Student Centre</strong></div></div></div>
<div class="timer-label" id="timer-label">Masa peperiksaan</div><div class="timer" id="timer" role="timer" aria-live="off">02:00:00</div><button class="button" id="start" type="button">Mula kira detik</button><p class="note" id="note">Tekan butang untuk memulakan pemasa 2 jam.</p></section></main>
<footer><b>UNIT PEPERIKSAAN</b> · Semoga berjaya dalam peperiksaan anda</footer>
<script>
const display=document.getElementById('timer'),button=document.getElementById('start'),note=document.getElementById('note'),label=document.getElementById('timer-label');let endAt=null,interval=null;const duration=2*60*60*1000;function render(){const left=Math.max(0,endAt-Date.now());const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);display.textContent=[h,m,s].map(n=>String(n).padStart(2,'0')).join(':');if(left===0){clearInterval(interval);interval=null;button.disabled=true;button.textContent='Masa tamat';note.textContent='Tempoh peperiksaan 2 jam telah tamat.';label.textContent='Peperiksaan selesai';}}
button.addEventListener('click',()=>{if(interval)return;endAt=Date.now()+duration;label.textContent='Masa berbaki';note.textContent='Pemasa berjalan · tempoh 2 jam';button.textContent='Pemasa sedang berjalan';button.disabled=true;render();interval=setInterval(render,250)});
</script></body></html>
